<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            max-width: 1140px;
            margin: 0 auto;
            
        }
            .box{
              
                padding: 10px;
                 border-radius: 10px;
                  display: flex;
                justify-content: center;
                align-items: center;
                
            }
        .box-1{
            background-color: #cfcfcf; 
          
    
        }
        .box-2{
            background-color: #f8f6d5;
           
          
        }
        .container{
           display: grid;
           grid-template-columns: 1fr 2fr;
           gap: 10px;
           margin:20px ;
           border: 2px solid black;
           padding: 20px;
           border-radius: 10px;

        }
        @media screen and (max-width:576px)  {
            .container{
                grid-template-columns: 1fr ; 
              
            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box-1"><h3>left</h3></div>
        <div class="box box-2"> <h3>right</h3></div>
    </div>
</body>
</html>
